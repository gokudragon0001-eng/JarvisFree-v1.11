plugins { id 'com.android.application' }

android {
    namespace 'com.rsking.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rsking.jarvis'
        minSdk 23
        targetSdk 32
        versionCode 9
        versionName '1.10'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
